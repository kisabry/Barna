<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Egyszerű, szerkeszthető napi journaling tábla.">
  <title>Daybook — Napi napló</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <button class="journaling-label" id="view-switcher" type="button" aria-expanded="true" aria-controls="view-menu">
        <span aria-hidden="true">▤</span><strong>Naptár</strong>
      </button>
      <div class="view-menu open" id="view-menu" role="menu" aria-label="Nézet kiválasztása">
        <button type="button" role="menuitem" data-view="journal" class="active">Naptár <b>⌘ 1</b></button>
        <button type="button" role="menuitem" data-view="calendar">Journaling <b>⌘ 2</b></button>
        <button type="button" role="menuitem" data-view="other">Egyéb <b>⌘ 3</b></button>
        <button class="add-tab" type="button" role="menuitem" data-add-tab><span>＋</span> Új fül hozzáadása</button>
      </div>
      <div class="header-actions">
        <button class="primary-button" id="add-entry" type="button"><span>＋</span> Új bejegyzés</button>
      </div>
      <h1 class="header-date" id="current-date">17. szeptember</h1>
    </header>

    <section class="journal-wrap" aria-label="Naplóbejegyzések">
      <div class="table-head table-grid"><span class="row-id">#</span><span>DÁTUM</span><span>HANGULAT</span><span>FÓKUSZ</span><span>MAI JEGYZET</span><span>ENERGIA</span><span></span></div>
      <div class="journal-body" id="journal-body"></div>
      <button class="add-row" id="add-row" type="button"><span>＋</span> Új sor hozzáadása</button>
    </section>
    <section class="empty-view" id="calendar-view" hidden>
      <strong>Journaling nézet</strong><span>Ez a nézet később tölthető fel.</span>
    </section>
    <section class="empty-view" id="other-view" hidden>
      <strong>Egyéb nézet</strong><span>Ide kerülhetnek a később hozzáadott nézetek.</span>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
